services:
  web:
    build: .
    image: medlibra-web:latest
    container_name: medlibra-web
    restart: unless-stopped
    ports:
      - "8084:80"
    networks:
      - stack-net
    depends_on:
      - auth

  auth:
    build: ./auth
    image: medlibra-web-auth:latest
    container_name: medlibra-web-auth
    restart: unless-stopped
    environment:
      - DOCS_AUTH_SECRET=${DOCS_AUTH_SECRET:-}
      - DOCS_SESSION_SECRET=${DOCS_SESSION_SECRET:-medlibra-docs-secret-change-me}
      - APEX_DOMAIN=${APEX_DOMAIN:-medlibra.com.ar}
    networks:
      - stack-net

networks:
  stack-net:
    external: true
    name: stack_stack-net
